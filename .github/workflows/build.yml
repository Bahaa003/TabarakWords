name: Build APK

# يعمل هذا الملف تلقائيًا في كل مرة ترفع فيها تحديثًا إلى الفرع main،
# ويمكن أيضًا تشغيله يدويًا من تبويب Actions على GitHub.
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: تنزيل نسخة المشروع
        uses: actions/checkout@v4

      - name: تجهيز Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: تجهيز Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: بناء APK (نسخة Debug جاهزة للتثبيت مباشرة)
        run: gradle assembleDebug --stacktrace

      - name: رفع ملف APK كملف تحميل (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: TabarakWords-APK
          path: app/build/outputs/apk/debug/app-debug.apk
